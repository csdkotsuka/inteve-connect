<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <!-- Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="30%" stop-color="#0d9488" />
      <stop offset="70%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <!-- Fold Shadow Gradient -->
    <linearGradient id="foldShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <!-- Filter -->
    <filter id="bannerShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#bannerShadow)">
    <!-- Left Ribbon Tail Behind -->
    <path d="M 50 35 L 10 65 L 50 95 L 90 95 L 90 35 Z" fill="#042f2e" />
    <path d="M 50 35 L 10 65 L 50 95 L 80 95 L 80 35 Z" fill="#0f766e" />

    <!-- Right Ribbon Tail Behind -->
    <path d="M 550 35 L 590 65 L 550 95 L 510 95 L 510 35 Z" fill="#042f2e" />
    <path d="M 550 35 L 590 65 L 550 95 L 520 95 L 520 35 Z" fill="#0f766e" />

    <!-- Left Fold Triangle -->
    <path d="M 75 75 L 75 95 L 95 75 Z" fill="url(#foldShadow)" />
    <!-- Right Fold Triangle -->
    <path d="M 525 75 L 525 95 L 505 75 Z" fill="url(#foldShadow)" />

    <!-- Center Main Ribbon Banner -->
    <path d="M 75 15 L 525 15 L 525 75 L 75 75 Z" fill="url(#tealGrad)" />

    <!-- Top & Bottom Gold / Light Borders -->
    <line x1="85" y1="20" x2="515" y2="20" stroke="#ccfbf1" stroke-width="1.5" opacity="0.6" />
    <line x1="85" y1="70" x2="515" y2="70" stroke="#ccfbf1" stroke-width="1.5" opacity="0.6" />
  </g>
</svg>
